<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Tracker</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#f5f5f5}.app{min-height:100vh;background:#111;padding:20px;--card:#1b1b1b;--border:#333;--muted:#aaa;--accent:#8df0b5}h1{margin:0 0 5px;font-size:28px}.sub{color:var(--muted);margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,.save{border:1px solid var(--border);background:var(--card);color:inherit;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}.tabs .active,.save{background:var(--accent);color:#101010;border-color:var(--accent)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 80px 80px 90px;gap:9px;align-items:center}.head{color:var(--muted);font-size:12px;margin-bottom:7px}.exercise{font-weight:700}.tag{display:inline-block;font-size:12px;color:var(--muted);margin-top:4px}input{width:100%;background:#111;border:1px solid var(--border);color:inherit;border-radius:9px;padding:9px;text-align:center}.check{width:20px;height:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:var(--muted);font-size:12px}.history{white-space:pre-line;color:#ddd;line-height:1.8}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.reset{background:transparent;color:#aaa;border:0;cursor:pointer}@media(max-width:650px){.app{padding:14px}.row{grid-template-columns:1fr 65px 65px 55px}.summary{grid-template-columns:1fr 1fr 1fr}h1{font-size:24px}}
</style></head><body><main class="app"><h1>🏋️ Workout Tracker</h1><div class="sub">Full Body — 3 أيام في الأسبوع</div><div class="tabs"><button id="a" class="active">Workout A</button><button id="b">Workout B</button></div><section class="card"><div class="row head"><div>التمرين</div><div>Sets</div><div>Reps</div><div>تم</div></div><div id="list"></div></section><section class="card"><div class="summary"><div class="stat"><span class="muted">إجمالي الـ Sets</span><b id="sets">0</b></div><div class="stat"><span class="muted">Volume</span><b id="vol">0</b></div><div class="stat"><span class="muted">تمارين مكتملة</span><b id="done">0/4</b></div></div></section><section class="card"><div class="actions"><button class="save" id="save">حفظ التمرين</button><button class="reset" id="reset">مسح بيانات اليوم</button></div><div id="history" class="history" style="margin-top:12px"></div></section><section class="card"><h2 style="margin-top:0">📈 التطور بالأرقام</h2><div class="summary"><div class="stat"><span class="muted">عدد التمرينات</span><b id="workoutsCount">0</b></div><div class="stat"><span class="muted">إجمالي الـ Volume</span><b id="totalVolume">0</b></div><div class="stat"><span class="muted">أعلى Volume</span><b id="bestVolume">0</b></div><div class="stat"><span class="muted">أعلى وزن</span><b id="maxWeight">0</b></div><div class="stat"><span class="muted">متوسط Volume</span><b id="avgVolume">0</b></div><div class="stat"><span class="muted">آخر Volume</span><b id="lastVolume">0</b></div></div><div id="progress" class="history" style="margin-top:14px"></div></section></main><script>
const workouts={A:[['Squat',3,8],['Bench Press',3,8],['Lat Pulldown',3,10],['Romanian Deadlift',3,10]],B:[['Leg Press',3,10],['Overhead Press',3,8],['Seated Row',3,10],['Leg Curl',3,10]]};let type='A',data=JSON.parse(localStorage.getItem('wt')||'{}');
function render(){document.getElementById('a').classList.toggle('active',type==='A');document.getElementById('b').classList.toggle('active',type==='B');const l=document.getElementById('list');l.innerHTML='';(workouts[type]).forEach((x,i)=>{const key=type+i, v=data[key]||{};l.innerHTML+=`<div class="row" style="margin-bottom:10px"><div class="exercise">${x[0]}<span class="tag">${x[1]} × ${x[2]}</span></div><input class="weight" data-i="${i}" type="number" placeholder="kg" value="${v.weight||''}"><input class="reps" data-i="${i}" type="number" placeholder="reps" value="${v.reps||x[2]}"><input class="check" data-i="${i}" type="checkbox" ${v.done?'checked':''}></div>`});document.querySelectorAll('input').forEach(e=>e.oninput=calc);calc();history();progress()}
function calc(){let sets=0,vol=0,done=0;document.querySelectorAll('.row:not(.head)').forEach((r,i)=>{const s=workouts[type][i][1],w=+r.querySelector('.weight').value||0,rep=+r.querySelector('.reps').value||0;sets+=s;vol+=s*w*rep;if(r.querySelector('.check').checked)done++});document.getElementById('sets').textContent=sets;document.getElementById('vol').textContent=Math.round(vol);document.getElementById('done').textContent=done+'/4'}
function save(){let volume=0,maxWeight=0;document.querySelectorAll('.row:not(.head)').forEach((r,i)=>{const w=+r.querySelector('.weight').value||0,rep=+r.querySelector('.reps').value||0,s=workouts[type][i][1];volume+=s*w*rep;maxWeight=Math.max(maxWeight,w);data[type+i]={weight:r.querySelector('.weight').value,reps:r.querySelector('.reps').value,done:r.querySelector('.check').checked}});localStorage.setItem('wt',JSON.stringify(data));const h=JSON.parse(localStorage.getItem('history')||'[]');h.unshift({date:new Date().toLocaleString('ar-EG'),type,volume,maxWeight});localStorage.setItem('history',JSON.stringify(h.slice(0,100)));history();progress()}
function history(){const h=JSON.parse(localStorage.getItem('history')||'[]');document.getElementById('history').textContent=h.length?'آخر التمرينات:\n'+h.slice(0,10).map(x=>x.date+' — Workout '+x.type+' — Volume: '+Math.round(x.volume)+' — أعلى وزن: '+x.maxWeight+' kg').join('\n'):'مفيش تمرينات محفوظة لسه.'}
function progress(){const h=JSON.parse(localStorage.getItem('history')||'[]');const vols=h.map(x=>+x.volume||0),weights=h.map(x=>+x.maxWeight||0),total=vols.reduce((a,b)=>a+b,0);document.getElementById('workoutsCount').textContent=h.length;document.getElementById('totalVolume').textContent=Math.round(total);document.getElementById('bestVolume').textContent=Math.round(Math.max(0,...vols));document.getElementById('maxWeight').textContent=Math.max(0,...weights)+' kg';document.getElementById('avgVolume').textContent=Math.round(h.length?total/h.length:0);document.getElementById('lastVolume').textContent=Math.round(vols[0]||0);document.getElementById('progress').textContent=h.length?'آخر 10 نتائج:\n'+h.slice(0,10).map((x,i)=> (i+1)+'. '+x.date+' | '+x.type+' | Volume '+Math.round(x.volume)+' | Max '+x.maxWeight+' kg').join('\n'):'ابدأ أول تمرينة عشان نبدأ قياس التطور.'}document.getElementById('a').onclick=()=>{type='A';render()};document.getElementById('b').onclick=()=>{type='B';render()};document.getElementById('save').onclick=save;document.getElementById('reset').onclick=()=>{data={};localStorage.removeItem('wt');render()};render();
function addTool(title,html){const s=document.createElement('section');s.className='card';s.innerHTML='<h2>'+title+'</h2>'+html;document.querySelector('.app').appendChild(s)}const ex={'رجل أمامي':['Squat','Leg Press','Hack Squat','Leg Extension','Front Squat','Lunges'],'رجل خلفي':['Romanian Deadlift','Leg Curl','Nordic Curl'],'سمان':['Standing Calf Raise','Seated Calf Raise'],'ضامة':['Adductor Machine','Cable Adduction'],'خلفية':['Hip Thrust','Glute Bridge','Cable Kickback'],'باي':['Barbell Curl','Hammer Curl','Preacher Curl','Cable Curl'],'تراي':['Rope Pushdown','Skull Crushers','Dips'],'فور آرمز':['Wrist Curl','Reverse Wrist Curl','Farmer Walk'],'كتف أمامي':['Overhead Press','Arnold Press','Front Raise'],'كتف جانبي':['Lateral Raise','Cable Lateral Raise','Machine Lateral Raise'],'كتف خلفي':['Reverse Fly','Face Pull','Rear Delt Row'],'ترابيس':['Barbell Shrug','Dumbbell Shrug','Farmer Walk'],'رقبة':['Neck Flexion','Neck Extension','Neck Lateral Flexion'],'صدر علوي':['Incline Bench Press','Incline Dumbbell Press','Low To High Cable Fly'],'صدر أوسط':['Bench Press','Dumbbell Bench Press','Cable Fly','Pec Deck'],'صدر سفلي':['Decline Bench Press','Decline Dumbbell Press','High To Low Cable Fly','Dips'],'ضهر لاتس':['Lat Pulldown','Pull Ups','Chin Ups'],'ضهر منتصف':['Seated Row','Barbell Row','Dumbbell Row','Chest Supported Row'],'ضهر علوي':['Face Pull','High Row','Wide Grip Row'],'أسفل الضهر':['Deadlift','Back Extension','Good Morning'],'بطن':['Crunch','Cable Crunch','Hanging Leg Raise','Reverse Crunch','Ab Wheel','Plank']};let rt=0,ri=null;addTool('⏱️ مؤقت الراحة','<div id="rt" style="font-size:36px;text-align:center">01:30</div><button class="save" onclick="startR(30)">30ث</button> <button class="save" onclick="startR(60)">60ث</button> <button class="save" onclick="startR(90)">90ث</button> <button class="save" onclick="startR(120)">120ث</button>');addTool('🛠️ مكتبة التمارين','<select id="m"><option>اختر العضلة</option>'+Object.keys(ex).map(x=>'<option>'+x+'</option>').join('')+'</select><select id="e"><option>اختر التمرين</option></select><button class="save" onclick="addE()">إضافة</button>');m.onchange=()=>e.innerHTML=ex[m.value].map(x=>'<option>'+x+'</option>').join('');function addE(){if(e.value){workouts[type].push([e.value,3,10]);render()}}addTool('🏃 كارديو','<select id="cn"><option>Walking</option><option>Treadmill</option><option>Running</option><option>Cycling</option><option>Elliptical</option><option>Rowing Machine</option><option>Stair Climber</option><option>Jump Rope</option><option>Swimming</option></select><input id="cm" type="number" placeholder="الدقائق"><button class="save" onclick="startR((+cm.value||0)*60)">ابدأ</button>');function startR(s){clearInterval(ri);rt=s;showR();ri=setInterval(()=>{rt--;showR();if(rt<=0){clearInterval(ri);alert('انتهى المؤقت 🔔')}},1000)}function showR(){rtEl=document.getElementById('rt');if(rtEl)rtEl.textContent=Math.floor(rt/60)+':'+String(rt%60).padStart(2,'0')}addTool('🍽️ حاسبة الأكل','<input id="fn" placeholder="chicken / rice / egg"><input id="fg" type="number" placeholder="الجرام"><button class="save" onclick="food()">احسب</button><div id="fo"></div>');const foods={chicken:[165,31,0,3.6],rice:[130,2.7,28,.3],egg:[155,13,1.1,11],beef:[250,26,0,15],tuna:[132,29,0,1],oats:[389,17,66,7],milk:[61,3.2,4.8,3.3],banana:[89,1.1,23,.3],bread:[265,9,49,3.2]};function food(){const k=Object.keys(foods).find(x=>fn.value.toLowerCase().includes(x)),q=(+fg.value||0)/100;if(!k){fo.textContent='الصنف غير موجود في القاعدة المبدئية.';return}const a=foods[k];fo.innerHTML='Calories: <b>'+Math.round(a[0]*q)+' kcal</b><br>Protein: <b>'+(a[1]*q).toFixed(1)+' g</b> | Carbs: <b>'+(a[2]*q).toFixed(1)+' g</b> | Fat: <b>'+(a[3]*q).toFixed(1)+' g</b>'}const oldR=render;render=function(){oldR();document.querySelectorAll('.row:not(.head)').forEach((r,i)=>{if(!r.querySelector('.actualSets')){const s=document.createElement('input');s.className='actualSets';s.type='number';s.min='0';s.value=(data[type+i]&&data[type+i].sets)||workouts[type][i][1];r.insertBefore(s,r.querySelector('.weight'));const b=document.createElement('button');b.className='save';b.textContent='تغيير';b.onclick=()=>{const n=prompt('اسم التمرين',workouts[type][i][0]);if(n){workouts[type][i][0]=n;render()}};r.appendChild(b)}})};calc=function(){let ss=0,v=0,d=0;document.querySelectorAll('.row:not(.head)').forEach(r=>{const s=+r.querySelector('.actualSets').value||0,w=+r.querySelector('.weight').value||0,p=+r.querySelector('.reps').value||0;ss+=s;v+=s*w*p;if(r.querySelector('.check').checked)d++});sets.textContent=ss;vol.textContent=Math.round(v);done.textContent=d+'/'+workouts[type].length};save=function(){let v=0,m=0,ss=0;document.querySelectorAll('.row:not(.head)').forEach((r,i)=>{const s=+r.querySelector('.actualSets').value||0,w=+r.querySelector('.weight').value||0,p=+r.querySelector('.reps').value||0;v+=s*w*p;m=Math.max(m,w);ss+=s;data[type+i]={weight:r.querySelector('.weight').value,reps:r.querySelector('.reps').value,sets:s,done:r.querySelector('.check').checked}});localStorage.setItem('wt',JSON.stringify(data));const h=JSON.parse(localStorage.getItem('history')||'[]');h.unshift({date:new Date().toLocaleString('ar-EG'),type,volume:v,maxWeight:m,actualSets:ss});localStorage.setItem('history',JSON.stringify(h.slice(0,500)));history();progress()};document.getElementById('save').onclick=save;render();</script></body></html>
