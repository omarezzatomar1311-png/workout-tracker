<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Tracker</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#f5f5f5}.app{min-height:100vh;background:#111;padding:20px;--card:#1b1b1b;--border:#333;--muted:#aaa;--accent:#8df0b5}h1{margin:0 0 5px;font-size:28px}.sub{color:var(--muted);margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,.save{border:1px solid var(--border);background:var(--card);color:inherit;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}.tabs .active,.save{background:var(--accent);color:#101010;border-color:var(--accent)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 80px 80px 90px;gap:9px;align-items:center}.head{color:var(--muted);font-size:12px;margin-bottom:7px}.exercise{font-weight:700}.tag{display:inline-block;font-size:12px;color:var(--muted);margin-top:4px}input{width:100%;background:#111;border:1px solid var(--border);color:inherit;border-radius:9px;padding:9px;text-align:center}.check{width:20px;height:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:var(--muted);font-size:12px}.history{white-space:pre-line;color:#ddd;line-height:1.8}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.reset{background:transparent;color:#aaa;border:0;cursor:pointer}@media(max-width:650px){.app{padding:14px}.row{grid-template-columns:1fr 65px 65px 55px}.summary{grid-template-columns:1fr 1fr 1fr}h1{font-size:24px}}
</style></head><body><main class="app"><h1>🏋️ Workout Tracker</h1><div class="sub">Full Body — 3 أيام في الأسبوع</div><div class="tabs"><button id="a" class="active">Workout A</button><button id="b">Workout B</button></div><section class="card"><div class="row head"><div>التمرين</div><div>Sets</div><div>Reps</div><div>تم</div></div><div id="list"></div></section><section class="card"><div class="summary"><div class="stat"><span class="muted">إجمالي الـ Sets</span><b id="sets">0</b></div><div class="stat"><span class="muted">Volume</span><b id="vol">0</b></div><div class="stat"><span class="muted">تمارين مكتملة</span><b id="done">0/4</b></div></div></section><section class="card"><div class="actions"><button class="save" id="save">حفظ التمرين</button><button class="reset" id="reset">مسح بيانات اليوم</button></div><div id="history" class="history" style="margin-top:12px"></div></section></main><script>
const workouts={A:[['Squat',3,8],['Bench Press',3,8],['Lat Pulldown',3,10],['Romanian Deadlift',3,10]],B:[['Leg Press',3,10],['Overhead Press',3,8],['Seated Row',3,10],['Leg Curl',3,10]]};let type='A',data=JSON.parse(localStorage.getItem('wt')||'{}');
function render(){document.getElementById('a').classList.toggle('active',type==='A');document.getElementById('b').classList.toggle('active',type==='B');const l=document.getElementById('list');l.innerHTML='';(workouts[type]).forEach((x,i)=>{const key=type+i, v=data[key]||{};l.innerHTML+=`<div class="row" style="margin-bottom:10px"><div class="exercise">${x[0]}<span class="tag">${x[1]} × ${x[2]}</span></div><input class="weight" data-i="${i}" type="number" placeholder="kg" value="${v.weight||''}"><input class="reps" data-i="${i}" type="number" placeholder="reps" value="${v.reps||x[2]}"><input class="check" data-i="${i}" type="checkbox" ${v.done?'checked':''}></div>`});document.querySelectorAll('input').forEach(e=>e.oninput=calc);calc();history()}
function calc(){let sets=0,vol=0,done=0;document.querySelectorAll('.row:not(.head)').forEach((r,i)=>{const s=workouts[type][i][1],w=+r.querySelector('.weight').value||0,rep=+r.querySelector('.reps').value||0;sets+=s;vol+=s*w*rep;if(r.querySelector('.check').checked)done++});document.getElementById('sets').textContent=sets;document.getElementById('vol').textContent=Math.round(vol);document.getElementById('done').textContent=done+'/4'}
function save(){document.querySelectorAll('.row:not(.head)').forEach((r,i)=>data[type+i]={weight:r.querySelector('.weight').value,reps:r.querySelector('.reps').value,done:r.querySelector('.check').checked});localStorage.setItem('wt',JSON.stringify(data));const h=JSON.parse(localStorage.getItem('history')||'[]');h.unshift(new Date().toLocaleString('ar-EG')+' — Workout '+type);localStorage.setItem('history',JSON.stringify(h.slice(0,10)));history()}
function history(){const h=JSON.parse(localStorage.getItem('history')||'[]');document.getElementById('history').textContent=h.length?'آخر التمرينات:\n'+h.join('\n'):'مفيش تمرينات محفوظة لسه.'}document.getElementById('a').onclick=()=>{type='A';render()};document.getElementById('b').onclick=()=>{type='B';render()};document.getElementById('save').onclick=save;document.getElementById('reset').onclick=()=>{data={};localStorage.removeItem('wt');render()};render();
</script></body></html>
